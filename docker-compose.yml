version: "3.9"

services:
  db:
    image: postgres:16
    container_name: vet_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: vetdb
      POSTGRES_USER: tecwebuser
      POSTGRES_PASSWORD: MiClaveSegura123
    ports:
      - "5433:5432"
    volumes:
      - vet_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tecwebuser -d vetdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vet_data:
